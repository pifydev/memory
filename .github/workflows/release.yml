name: Release

# Publish to npm when a version tag is pushed:
#   npm version patch && git push --follow-tags
#
# Auth: NPM_TOKEN org secret (pifydev org, visibility all). First publish
# creates the package; afterwards a Trusted Publisher can be configured on
# npmjs.com and this workflow switched to OIDC like pifydev/cli.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
